name: Refresh player data

on:
  schedule:
    - cron: "0 11 * * *" # daily, 11:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # If www.nba.com rosters come back incomplete, the script exits non-zero without
      # touching players.json, so we warn instead of failing the run.
      - name: Fetch players
        id: fetch
        continue-on-error: true
        run: python scripts/refresh_players.py

      - if: steps.fetch.outcome == 'failure'
        run: echo "::warning::Roster fetch failed; kept the existing players.json"

      - name: Commit if changed
        if: steps.fetch.outcome == 'success'
        run: |
          if git diff --quiet -- public/players.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/players.json
          git commit -m "Refresh player data"
          git push
